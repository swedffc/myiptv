<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamSonic IPTV Player</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- HLS.js for Streaming Playback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body {
background-color: #0f172a;
color: #f8fafc;
font-family: 'Inter', system-ui, -apple-system, sans-serif;
}
.custom-scrollbar::-webkit-scrollbar {
width: 6px;
}
.custom-scrollbar::-webkit-scrollbar-track {
background: #1e293b;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
background: #475569;
border-radius: 3px;
}
.custom-scrollbar::-webkit-scrollbar-thumb:hover {
background: #64748b;
}
.active-tab {
background-color: #2563eb;
color: #ffffff;
}
.active-channel {
border-left: 4px solid #3b82f6;
background-color: #1e293b;
}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- Top Navigation Bar -->
<header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between z-10">
<div class="flex items-center space-x-3">
<i class="fa-solid fa-play-circle text-blue-500 text-2xl"></i>
<span class="font-bold text-xl tracking-wide bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
StreamSonic Web
</span>
</div>

<div class="flex items-center space-x-4">
<button id="openPlaylistModal" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-blue-500/20">
<i class="fa-solid fa-link"></i> Load Playlist
</button>
<button id="themeToggle" class="text-slate-400 hover:text-white p-2 text-lg">
<i class="fa-solid fa-moon"></i>
</button>
</div>
</header>

<!-- Main Content Area -->
<div class="flex-1 flex overflow-hidden">

<!-- Sidebar Navigation & Channel List -->
<aside class="w-80 bg-slate-900/50 border-r border-slate-800 flex flex-col h-full">

<!-- Filter Tabs -->
<div class="p-3 border-b border-slate-800 grid grid-cols-4 gap-1 text-xs font-semibold text-center">
<button onclick="switchCategory('all')" id="tab-all" class="py-2 rounded-md active-tab transition">All</button>
<button onclick="switchCategory('live')" id="tab-live" class="py-2 rounded-md text-slate-400 hover:text-white transition">Live</button>
<button onclick="switchCategory('movies')" id="tab-movies" class="py-2 rounded-md text-slate-400 hover:text-white transition">Movies</button>
<button onclick="switchCategory('series')" id="tab-series" class="py-2 rounded-md text-slate-400 hover:text-white transition">Series</button>
</div>

<!-- Search Bar -->
<div class="p-3 border-b border-slate-800 relative">
<i class="fa-solid fa-search absolute left-6 top-6 text-slate-500 text-xs"></i>
<input type="text" id="searchInput" onkeyup="filterChannels()" placeholder="Search channels, movies..."
class="w-full bg-slate-800 text-slate-200 text-xs pl-8 pr-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500">
</div>

<!-- Channel Item List -->
<div id="channelList" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-slate-800/50">
<!-- Dynamic Channels Populated via JS -->
</div>
</aside>

<!-- Video Player & Content Screen -->
<main class="flex-1 flex flex-col bg-black relative">

<!-- Video Player Window -->
<div class="relative flex-1 bg-black flex items-center justify-center">
<video id="videoPlayer" class="w-full h-full object-contain" controls autoplay></video>

<!-- Placeholder / Loading Overlay -->
<div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 text-center p-6">
<i class="fa-solid fa-tv text-5xl text-slate-700 mb-4 animate-pulse"></i>
<h3 class="text-lg font-semibold text-slate-300">No Stream Selected</h3>
<p class="text-xs text-slate-500 mt-1 max-w-sm">Choose a channel from the sidebar or click "Load Playlist" to connect your M3U link.</p>
</div>
</div>

<!-- EPG / Currently Playing Bar -->
<div class="bg-slate-900 border-t border-slate-800 p-4 flex items-center justify-between">
<div class="flex items-center space-x-4">
<div id="currentChannelLogo" class="w-12 h-12 bg-slate-800 rounded-lg border border-slate-700 flex items-center justify-center text-slate-500 text-xs font-bold uppercase">
TV
</div>
<div>
<h2 id="currentChannelName" class="font-semibold text-slate-200 text-sm">Select a Channel</h2>
<p id="currentEpgText" class="text-xs text-slate-400 mt-0.5">StreamSonic Web Player Ready</p>
</div>
</div>

<div class="flex items-center space-x-3">
<button id="favBtn" onclick="toggleFavorite()" class="text-slate-500 hover:text-yellow-400 transition text-lg p-2">
<i class="fa-regular fa-star"></i>
</button>
<button onclick="reloadStream()" class="text-slate-400 hover:text-white transition text-lg p-2">
<i class="fa-solid fa-rotate-right"></i>
</button>
</div>
</div>
</main>
</div>

<!-- M3U Playlist Input Modal -->
<div id="playlistModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50">
<div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-xl shadow-2xl">
<div class="flex justify-between items-center mb-4">
<h3 class="font-semibold text-slate-200">Load M3U Playlist URL</h3>
<button id="closePlaylistModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
</div>
<p class="text-xs text-slate-400 mb-4">Paste your public M3U streaming playlist link below to populate live channels, movies, and series.</p>

<input type="url" id="m3uUrlInput" placeholder="https://example.com/playlist.m3u"
class="w-full bg-slate-800 text-slate-200 text-sm px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500 mb-4">

<div class="flex justify-end space-x-3">
<button id="cancelModalBtn" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">Cancel</button>
<button onclick="loadM3uFromInput()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-lg shadow-blue-500/20">Load Stream</button>
</div>
</div>
</div>

<!-- Application JavaScript -->
<script>
// Sample public initial channels
let channels = [
{ id: 1, name: "UK - Sky News Free", category: "live", url: "https://https-live-sky.akamaized.net/hls/live/2016523/skynews/master.m3u8", logo: "Sky" },
{ id: 2, name: "USA - ABC News Live", category: "live", url: "https://content.uplynk.com/channel/3324f73518c04914bed58461d02c40d2.m3u8", logo: "ABC" },
{ id: 3, name: "Public Film Vault 1", category: "movies", url: "https://test-streams.mux.dev/x36xhtml/x36xhtml.m3u8", logo: "Film" },
{ id: 4, name: "Classic Series Feed", category: "series", url: "https://playertest.longtailvideo.com/adaptive/oceans/oceans.m3u8", logo: "TV" }
];

let activeCategory = 'all';
let currentStream = null;
let hlsPlayer = null;

document.addEventListener("DOMContentLoaded", () => {
renderChannels(channels);

// Modal Controls
document.getElementById('openPlaylistModal').onclick = () => document.getElementById('playlistModal').classList.replace('hidden', 'flex');
document.getElementById('closePlaylistModal').onclick = () => document.getElementById('playlistModal').classList.replace('flex', 'hidden');
document.getElementById('cancelModalBtn').onclick = () => document.getElementById('playlistModal').classList.replace('flex', 'hidden');
});

function renderChannels(list) {
const container = document.getElementById('channelList');
container.innerHTML = '';

if (list.length === 0) {
container.innerHTML = `<p class="p-4 text-xs text-slate-500 text-center">No channels found</p>`;
return;
}

list.forEach(ch => {
const el = document.createElement('div');
el.className = `p-3 flex items-center justify-between cursor-pointer hover:bg-slate-800/60 transition ${currentStream?.id === ch.id ? 'active-channel' : ''}`;
el.onclick = () => playChannel(ch);

el.innerHTML = `
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-xs border border-slate-700">
${ch.logo}
</div>
<div>
<p class="text-xs font-medium text-slate-200">${ch.name}</p>
<span class="text-[10px] text-slate-500 uppercase tracking-wider">${ch.category}</span>
</div>
</div>
<i class="fa-solid fa-play text-slate-600 text-xs"></i>
`;
container.appendChild(el);
});
}

function playChannel(ch) {
currentStream = ch;
document.getElementById('playerPlaceholder').classList.add('hidden');
document.getElementById('currentChannelName').textContent = ch.name;
document.getElementById('currentEpgText').textContent = `Now Playing • ${ch.category.toUpperCase()}`;
document.getElementById('currentChannelLogo').textContent = ch.logo;

const video = document.getElementById('videoPlayer');

if (Hls.isSupported() && ch.url.includes('.m3u8')) {
if (hlsPlayer) hlsPlayer.destroy();
hlsPlayer = new Hls();
hlsPlayer.loadSource(ch.url);
hlsPlayer.attachMedia(video);
hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play());
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
video.src = ch.url;
video.play();
} else {
video.src = ch.url;
video.play();
}

renderChannels(getFilteredChannels());
}

function switchCategory(cat) {
activeCategory = cat;
['all', 'live', 'movies', 'series'].forEach(c => {
const btn = document.getElementById(`tab-${c}`);
if (c === cat) {
btn.className = "py-2 rounded-md active-tab transition";
} else {
btn.className = "py-2 rounded-md text-slate-400 hover:text-white transition";
}
});
renderChannels(getFilteredChannels());
}

function filterChannels() {
renderChannels(getFilteredChannels());
}

function getFilteredChannels() {
const query = document.getElementById('searchInput').value.toLowerCase();
return channels.filter(ch => {
const matchesCat = activeCategory === 'all' || ch.category === activeCategory;
const matchesSearch = ch.name.toLowerCase().includes(query);
return matchesCat && matchesSearch;
});
}

function loadM3uFromInput() {
const url = document.getElementById('m3uUrlInput').value.trim();
if (!url) return;

fetch(url)
.then(res => res.text())
.then(data => parseM3u(data))
.catch(() => alert('Failed to fetch M3U playlist. Ensure CORS is supported on the provider.'));

document.getElementById('playlistModal').classList.replace('flex', 'hidden');
}

function parseM3u(m3uText) {
const lines = m3uText.split('\n');
let newChannels = [];
let currentItem = null;

lines.forEach((line, index) => {
line = line.trim();
if (line.startsWith('#EXTINF:')) {
const name = line.split(',')[1] || `Channel ${index}`;
currentItem = { id: Date.now() + index, name, category: 'live', logo: name.substring(0, 3).toUpperCase() };
} else if (line && !line.startsWith('#') && currentItem) {
currentItem.url = line;
newChannels.push(currentItem);
currentItem = null;
}
});

if (newChannels.length > 0) {
channels = newChannels;
renderChannels(channels);
alert(`Loaded ${newChannels.length} channels successfully!`);
} else {
alert('No valid streams found in the M3U link.');
}
}

function reloadStream() {
if (currentStream) playChannel(currentStream);
}

function toggleFavorite() {
const btn = document.getElementById('favBtn');
btn.classList.toggle('text-yellow-400');
btn.classList.toggle('text-slate-500');
}
</script>
</body>
</html>
